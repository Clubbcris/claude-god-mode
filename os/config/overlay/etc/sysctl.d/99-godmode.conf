# GodMode OS tuning. Sized for 4-8 GB laptops backed by zram.

# With a compressed RAM swap device, swapping is cheap and eager swapping
# keeps more of RAM available for page cache. 60 is correct for disk swap;
# 180 is correct for zram and is what Fedora/Pop!_OS ship.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Favour keeping dentry/inode cache over reclaiming it; makes repeated
# file tree walks (git status, ripgrep, builds) much faster.
vm.vfs_cache_pressure = 50

# Flush dirty pages sooner so a big write never stalls the desktop.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20

# Agents and editors watch a lot of files; the default 8192 is far too low.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# Modern queueing + congestion control: lower latency on poor wifi.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
