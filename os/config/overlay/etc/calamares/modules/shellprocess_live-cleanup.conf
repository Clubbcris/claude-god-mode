---
dontChroot: false
timeout: 600
script:
  # Strip everything that only made sense while running from the USB stick.
  - "rm -f /etc/lightdm/lightdm.conf.d/10-godmode-autologin.conf"
  - "rm -f /etc/sudoers.d/90-godmode"
  - "rm -f /etc/casper.conf"
  - "sh -c 'DEBIAN_FRONTEND=noninteractive apt-get -y purge casper calamares calamares-settings-ubuntu-common >/dev/null 2>&1 || true'"
  - "sh -c 'rm -f /usr/share/applications/godmode-install.desktop /etc/skel/Desktop/godmode-install.desktop || true'"
  - "sh -c 'rm -f /home/*/Desktop/godmode-install.desktop || true'"
