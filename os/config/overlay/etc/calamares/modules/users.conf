---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - adm
  - cdrom
  - dip
  - plugdev
  - sudo
  - audio
  - video
  - netdev
autologinGroup: autologin
doAutologin: true
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 1
  libpwquality:
    - minlen=1
