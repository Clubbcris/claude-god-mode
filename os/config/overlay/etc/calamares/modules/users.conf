---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - adm
  - cdrom
  - dip
  - plugdev
  - sudo
  - audio
  - video
  - netdev
autologinGroup: autologin
# The displaymanager module is deliberately not in the install sequence, so
# nothing would act on an autologin choice. Leave it off rather than show a
# checkbox that does nothing; the installed system gets a login screen.
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 1
  libpwquality:
    - minlen=1
