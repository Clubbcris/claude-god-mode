---
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/lib/calamares/modules

instances:
  - id: live-cleanup
    module: shellprocess
    config: shellprocess_live-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@live-cleanup
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: godmode
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
